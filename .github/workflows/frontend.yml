name: React frontend
on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - 'scripts/**'
      - 'src/main/kotlin/com/clawfare/web/Server.kt'
      - 'scripts/verify-web-bundle.mjs'
      - 'build.gradle.kts'
      - '.github/workflows/frontend.yml'
  push:
    branches: [master]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Diagnostic formatting patch for PR (temporary)
        run: |
          npx oxfmt src/App.tsx src/SearchControls.tsx src/searchForm.ts
          git diff -- src/App.tsx src/SearchControls.tsx src/searchForm.ts
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run guest:check
        working-directory: web
