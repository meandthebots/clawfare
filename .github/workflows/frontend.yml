name: React frontend
on:
  pull_request:
    paths:
      - 'web/**'
      - 'api/**'
      - 'scripts/generate-openapi.mjs'
      - 'src/main/kotlin/com/clawfare/web/Server.kt'
      - 'scripts/verify-web-bundle.mjs'
      - 'build.gradle.kts'
      - '.github/workflows/frontend.yml'
  push:
    branches: [master]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: web
      - name: Preview issue 79 canonical format diff
        working-directory: web
        run: |
          npm exec -- oxfmt src/api.ts src/domain.ts src/openapi.test.ts
          git diff -- src/api.ts src/domain.ts src/openapi.test.ts
      - run: npm run check
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
