name: Mobile grid interaction

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'web/**'
      - 'build.gradle.kts'
      - 'scripts/verify-web-bundle.mjs'
      - 'scripts/guest-*'
      - 'scripts/build-guest-preview.mjs'
      - 'sites-runtime/tests/guest-preview-browser.mjs'
      - 'sites-runtime/tests/mobile-grid-browser.mjs'
      - 'sites-runtime/tests/react-app-browser.mjs'
      - 'sites-runtime/tests/guest-browser.mjs'
      - '.github/workflows/mobile-grid.yml'

jobs:
  mobile-grid:
    # Playwright Chromium 1.58 does not support ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate real Kotlin sample
        run: bash scripts/build-sites-preview.sh build/sites/clawfare-sample.html
      - name: Install Playwright and Chromium for mobile touch verification
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Verify mobile tap details and existing desktop grid
        run: node sites-runtime/tests/mobile-grid-browser.mjs build/frontend/web/index.html build/sites/clawfare-sample.json
      - name: Verify hosted React UI safety and diagnostics
        run: node sites-runtime/tests/react-app-browser.mjs build/frontend/web/index.html build/sites/clawfare-sample.json

      - name: Verify credential-free guest UI without network calls
        run: node sites-runtime/tests/guest-browser.mjs build/frontend/web/index.html
      - name: Build advanced offline guest QA preview
        run: node scripts/build-guest-preview.mjs
      - name: Test advanced guest QA search/export flows in desktop and mobile Chromium
        run: node sites-runtime/tests/guest-preview-browser.mjs build/guest-preview.html
