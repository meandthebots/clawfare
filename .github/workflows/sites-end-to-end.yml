name: Sites read-only full-stack integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sites-runtime/**'
      - 'fare-core/**'
      - 'web/**'
      - 'build.gradle.kts'
      - 'scripts/verify-web-bundle.mjs'
      - 'src/main/kotlin/com/clawfare/search/**'
      - 'src/main/kotlin/com/clawfare/cli/FareCommands.kt'
      - 'scripts/build-sites-preview.sh'
      - '.github/workflows/sites-end-to-end.yml'

jobs:
  read-only-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build real Kotlin/JS production artifact and JVM sample
        run: |
          ./gradlew :fare-core:jsBrowserProductionWebpack
          bash scripts/build-sites-preview.sh build/sites/clawfare-sample.html
      - name: Verify public fixture is safe to bootstrap
        run: node scripts/validate-kotlin-public-sample.mjs build/sites/clawfare-sample.json
      - name: Execute SQLite D1 / Fetch / Kotlin cross-runtime integration
        run: |
          node --experimental-sqlite sites-runtime/tests/real-sqlite-integration.mjs \
            build/sites/clawfare-sample.json \
            fare-core/build/kotlin-webpack/js/productionExecutable \
            build/frontend/web/index.html
      - name: Upload sample-only preview
        uses: actions/upload-artifact@v4
        with:
          name: clawfare-sites-e2e-preview
          path: |
            build/sites/clawfare-sample.html
            build/sites/clawfare-sample.json
          if-no-files-found: error
          retention-days: 7
