name: Sites Kotlin/JS production bundle

on:
  pull_request:
    paths:
      - 'fare-core/**'
      - 'scripts/verify-sites-js-bundle.mjs'
      - '.github/workflows/sites-kotlin-js.yml'
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate Kotlin/JS hosted bridge
        run: ./gradlew :fare-core:jsBrowserProductionWebpack
      - name: Execute compiled Kotlin in Node as a CommonJS library
        run: node scripts/verify-sites-js-bundle.mjs
      - name: Upload verified JS artifact
        uses: actions/upload-artifact@v4
        with:
          name: clawfare-sites-kotlin-js
          path: fare-core/build/kotlin-webpack/js/productionExecutable/*.js
          if-no-files-found: error
          retention-days: 14
