name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Offline, synthetic end-to-end smoke test
        env:
          SERPAPI_API_KEY: ''
          SEARCHAPI_API_KEY: ''
          TRAVELPAYOUTS_API_TOKEN: ''
          DUFFEL_ACCESS_TOKEN: ''
          DUFFEL_LIVE_ENABLED: 'false'
        run: ./gradlew test --tests "com.clawfare.OfflineEndToEndSmokeTest"

  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Compile Kotlin sources
        run: ./gradlew compileKotlin

      - name: Run lint
        run: ./gradlew ktlintCheck
      
      - name: Run tests with coverage
        run: ./gradlew test koverVerify koverHtmlReport
      
      - name: Test the coverage-audit parser (hermetic fixtures)
        run: python3 -m unittest discover -s scripts -p 'test_legacy_coverage_audit.py' -v

      - name: Generate unfiltered JVM CLI coverage audit
        run: |
          ./gradlew koverXmlReport koverXmlReportJvm
          python3 scripts/audit_legacy_coverage.py \
            --unfiltered build/reports/kover/unfiltered-jvm.xml \
            --filtered build/reports/kover/report.xml \
            --gradle build.gradle.kts \
            --markdown build/reports/kover/legacy-audit.md \
            --json build/reports/kover/legacy-audit.json

      - name: Upload unfiltered legacy coverage audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-cli-unfiltered-coverage
          path: |
            build/reports/kover/unfiltered-jvm.xml
            build/reports/kover/report.xml
            build/reports/kover/legacy-audit.md
            build/reports/kover/legacy-audit.json

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/kover/html/

  multiplatform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Node.js for Kotlin/JS and Kotlin/Wasm tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and test the shared contracts on all three targets
        run: ./gradlew :fare-core:jvmTest :fare-core:jsNodeTest :fare-core:wasmJsNodeTest
