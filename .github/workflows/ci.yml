name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Offline, synthetic end-to-end smoke test
        env:
          SERPAPI_API_KEY: ''
          SEARCHAPI_API_KEY: ''
          TRAVELPAYOUTS_API_TOKEN: ''
          DUFFEL_ACCESS_TOKEN: ''
          DUFFEL_LIVE_ENABLED: 'false'
        run: ./gradlew test --tests "com.clawfare.OfflineEndToEndSmokeTest"

  check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Compile Kotlin sources
        run: ./gradlew compileKotlin

      - name: Run lint
        run: ./gradlew ktlintCheck
      
      - name: Run tests with coverage
        run: ./gradlew test koverVerify koverHtmlReport
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: build/reports/kover/html/
