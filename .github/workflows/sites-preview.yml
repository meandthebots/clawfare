name: Build read-only Sites preview

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/build-sites-preview.sh'
      - '.github/workflows/sites-preview.yml'
      - 'web/**'
      - 'build.gradle.kts'
      - 'scripts/verify-web-bundle.mjs'
      - 'src/main/kotlin/com/clawfare/search/**'
      - 'src/main/kotlin/com/clawfare/export/**'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate sample-only portable HTML
        run: bash scripts/build-sites-preview.sh build/sites/clawfare-sample.html
      - name: Validate public Kotlin sample against hosted D1 rules
        run: node scripts/validate-kotlin-public-sample.mjs build/sites/clawfare-sample.json
      - name: Upload static Sites preview
        uses: actions/upload-artifact@v4
        with:
          name: clawfare-sites-sample
          path: |
            build/sites/clawfare-sample.html
            build/sites/clawfare-sample.json
          retention-days: 14
